services:
  - type: web
    name: janseva-backend
    runtime: python
    buildCommand: pip install --retries 5 -r requirements.txt && python backend/manage.py collectstatic --no-input && python backend/manage.py migrate
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: SUPABASE_DB_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
